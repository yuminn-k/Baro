apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-workload
  namespace: demo
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-workload
    spec:
      containers:
        - name: workload
          image: k8s-monitoring-lab:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-workload
  namespace: demo
  labels:
    app.kubernetes.io/name: cpu-workload
    release: monitoring
spec:
  selector:
    app.kubernetes.io/name: cpu-workload
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cpu-workload
  namespace: demo
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-workload
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
