apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-monitoring-lab-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-monitoring-lab.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 11, "w": 6, "x": 0, "y": 0}, "id": 1, "targets": [{"expr": "sum(rate(cpu_work_requests_total{namespace=\"demo\", outcome=\"completed\"}[$__rate_interval]))", "legendFormat": "completed"}], "title": "Traffic", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.8}]}, "thresholdsStyle": {"mode": "area+line"}, "unit": "percentunit"}, "overrides": []}, "gridPos": {"h": 11, "w": 6, "x": 6, "y": 0}, "id": 2, "targets": [{"expr": "max(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"demo\", container=\"workload\", image!=\"\"}[$__rate_interval])) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"demo\", container=\"workload\", resource=\"cpu\", unit=\"core\"}))", "legendFormat": "max pod usage"}, {"expr": "vector(0.8)", "legendFormat": "alert target 80%"}], "title": "CPU saturation 80%", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 11, "w": 6, "x": 12, "y": 0}, "id": 3, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(cpu_work_request_duration_seconds_bucket{namespace=\"demo\", outcome=\"completed\"}[$__rate_interval])))", "legendFormat": "p95"}, {"expr": "histogram_quantile(0.99, sum by (le) (rate(cpu_work_request_duration_seconds_bucket{namespace=\"demo\", outcome=\"completed\"}[$__rate_interval])))", "legendFormat": "p99"}], "title": "Latency", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 11, "w": 6, "x": 18, "y": 0}, "id": 4, "targets": [{"expr": "sum by (outcome) (rate(cpu_work_requests_total{namespace=\"demo\", outcome=~\"rejected|cancelled\"}[$__rate_interval]))", "legendFormat": "{{outcome}}"}], "title": "Errors", "type": "timeseries"}
      ],
      "schemaVersion": 39,
      "tags": ["kubernetes", "monitoring"],
      "title": "Kubernetes Monitoring Lab",
      "uid": "k8s-monitoring-lab",
      "version": 2
    }
