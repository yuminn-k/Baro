apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-benchmark-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kafka-benchmark.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"decimals":0,"unit":"short"},"overrides":[]},"gridPos":{"h":11,"w":6,"x":0,"y":0},"id":1,"options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom","showLegend":true}},"targets":[{"expr":"sum(rate(benchmark_producer_accepted_total{namespace=\"kafka-benchmark\"}[$__rate_interval]))","legendFormat":"acknowledged"}],"title":"Traffic","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"decimals":0,"unit":"short"},"overrides":[]},"gridPos":{"h":11,"w":6,"x":6,"y":0},"id":2,"options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom","showLegend":true}},"targets":[{"expr":"sum(benchmark_consumer_lag{namespace=\"kafka-benchmark\"})","legendFormat":"messages"}],"title":"Saturation (backlog)","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]},"gridPos":{"h":11,"w":6,"x":12,"y":0},"id":3,"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(benchmark_event_end_to_end_seconds_bucket{namespace=\"kafka-benchmark\"}[$__rate_interval])))","legendFormat":"p95"},{"expr":"histogram_quantile(0.99, sum by (le) (rate(benchmark_event_end_to_end_seconds_bucket{namespace=\"kafka-benchmark\"}[$__rate_interval])))","legendFormat":"p99"}],"title":"Latency","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"decimals":0,"unit":"short"},"overrides":[]},"gridPos":{"h":11,"w":6,"x":18,"y":0},"id":4,"options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom","showLegend":true}},"targets":[{"expr":"sum(rate(benchmark_producer_rejected_total{namespace=\"kafka-benchmark\"}[$__rate_interval]))","legendFormat":"HTTP rejected"},{"expr":"sum(rate(benchmark_producer_publish_failed_total{namespace=\"kafka-benchmark\"}[$__rate_interval]))","legendFormat":"publish failed"},{"expr":"sum(rate(benchmark_consumer_inserted_total{namespace=\"kafka-benchmark\"}[$__rate_interval]))","legendFormat":"inserted"},{"expr":"sum(rate(benchmark_consumer_conflicts_total{namespace=\"kafka-benchmark\"}[$__rate_interval]))","legendFormat":"deduplicated"}],"title":"Errors & Idempotency","type":"timeseries"}
      ],
      "schemaVersion":39,
      "tags":["kafka","benchmark"],
      "time":{"from":"now-15m","to":"now"},
      "title":"Kafka MSA Benchmark",
      "uid":"kafka-msa-benchmark",
      "version":3
    }
