apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-benchmark-script
  namespace: kafka-benchmark
data:
  benchmark.js: |
    import http from 'k6/http';
    import { check } from 'k6';
    import exec from 'k6/execution';

    export const options = {
      scenarios: {
        benchmark: {
          executor: 'shared-iterations',
          vus: 100,
          iterations: 1000000,
          maxDuration: '10m',
          gracefulStop: '0s',
        },
      },
      thresholds: {
        checks: ['rate==1'],
        http_req_failed: ['rate==0'],
        dropped_iterations: ['count==0'],
      },
    };

    export default function () {
      const eventID = exec.scenario.iterationInTest;
      const payload = `${eventID}`.padEnd(256, 'x');
      const response = http.post(
        'http://ingest.kafka-benchmark.svc.cluster.local:8080/events',
        JSON.stringify({ event_id: eventID, submitted_at_unix_ms: Date.now(), payload }),
        { headers: { 'Content-Type': 'application/json' }, timeout: '30s' },
      );
      check(response, { 'Kafka acknowledgement received': (result) => result.status === 202 });
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-benchmark-load
  namespace: kafka-benchmark
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          args: [run, /scripts/benchmark.js]
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
      volumes:
        - name: script
          configMap:
            name: kafka-benchmark-script
