apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: baro-platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.1.3
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/gitops/platform-monitoring/values.yaml
    - repoURL: https://github.com/yuminn-k/k8s-monitoring.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/yuminn-k/k8s-monitoring.git
      targetRevision: main
      path: gitops/platform-monitoring/resources
  destination:
    name: in-cluster
    namespace: monitoring
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: monitoring-grafana
      namespace: monitoring
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: monitoring-grafana
      namespace: monitoring
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
